[project]
name = "saq-qurylys-backend"
version = "0.1.0"
description = "SAQ QURYLYS backend: API, Celery workers, data model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asn1crypto>=1.5.1",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "minio>=7.2.20",
    "phonenumbers>=9.0.41",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8,<23",
    "qrcode>=8",
    "rapidfuzz>=3.14.6",
    "redis>=6.4.0",
    "selectolax>=1.0",
    "sqlalchemy>=2.1.4",
    "telethon>=1.40,<2",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
# Object detector of SAQ VISION (docs/SAQ_VISION_EVAL.md). Installed only in the Dockerfile `vision*` stages
# (`uv sync --extra vision-cpu` or `--extra vision-gpu`, never both). The api and worker images do not contain it,
# and the API never imports it.
vision-cpu = [
    "torch>=2.5",
    "transformers>=4.50",
]
vision-gpu = [
    "torch>=2.5",
    "transformers>=4.50",
]

[tool.uv]
package = false
conflicts = [[{ extra = "vision-cpu" }, { extra = "vision-gpu" }]]

# Torch comes from the PyTorch indexes, as in uv's "Using uv with PyTorch" guide: CPU-only wheels for `vision-cpu`
# (the default PyPI wheel for Linux pulls gigabytes of CUDA libraries) and CUDA 12.8 wheels for `vision-gpu`.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "vision-cpu" },
    { index = "pytorch-cu128", extra = "vision-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "ASYNC", "PT"]
ignore = [
    "RUF001", # Cyrillic text in strings is intentional (user-facing messages are Russian)
    "RUF002",
    "RUF003",
    "B008",   # FastAPI Depends()/Form() in argument defaults
    "S101",   # assert is fine in tests
    "SIM108",
    "PT018",  # composite assertions are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501"]
"alembic/versions/*" = ["E501", "RUF012", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "geoalchemy2.*", "minio.*", "weasyprint.*", "asn1crypto.*", "pymorphy3.*", "rapidfuzz.*", "phonenumbers.*", "pytesseract.*", "telethon.*", "qrcode.*", "torch.*", "transformers.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
